[project]
name = "stateful-rag-assistant"
version = "0.1.0"
description = "A stateful document-aware chat assistant built with Streamlit."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "argon2-cffi>=25.1.0",
    "chromadb>=1.5.9",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.17",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pypdf>=6.21.3",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "convorag"
module-root = "src"

[dependency-groups]
dev = [
    "ty>=0.0.107",
]
